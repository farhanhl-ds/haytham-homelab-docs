---
- name: Create Vaultwarden data directory
  ansible.builtin.file:
    path: "{{ vaultwarden_data_dir }}/vw-data"
    state: directory
    mode: "0755"

- name: Deploy Vaultwarden compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart vaultwarden

- name: Bring Vaultwarden up
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_data_dir }}"
    state: present
