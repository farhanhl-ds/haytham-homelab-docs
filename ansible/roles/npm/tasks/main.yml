---
- name: Create NPM compose directory
  ansible.builtin.file:
    path: "{{ npm_data_dir }}"
    state: directory
    mode: "0755"

- name: Deploy NPM compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ npm_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart npm

- name: Bring NPM up
  community.docker.docker_compose_v2:
    project_src: "{{ npm_data_dir }}"
    state: present
