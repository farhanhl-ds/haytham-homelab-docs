---
- name: Create Karakeep data directories
  ansible.builtin.file:
    path: "{{ karakeep_data_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [data, meili_data]

- name: Deploy Karakeep compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ karakeep_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart karakeep

- name: Bring Karakeep up
  community.docker.docker_compose_v2:
    project_src: "{{ karakeep_data_dir }}"
    state: present
